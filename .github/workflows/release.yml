name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['packages/vue-warden--release_created'] }}
    steps:
      # RELEASE_TOKEN is a personal access token of the repository owner, so
      # release pull requests, tags and releases are authored by the owner.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test:coverage
      - run: pnpm build
      # Trusted publishing: npm exchanges the GitHub OIDC token for a
      # short-lived publish credential, so no npm token is stored.
      - run: pnpm --filter vue-warden publish --access public --provenance --no-git-checks
